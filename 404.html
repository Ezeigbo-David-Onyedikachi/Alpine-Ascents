<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Alpine Ascents</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect hack
      // When GitHub Pages encounters a 404, it serves this file.
      // This script encodes the current path into a query parameter
      // and redirects to index.html, which then restores the route.
      var pathSegmentsToKeep = 1; // Keep 1 segment for /repo-name/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
